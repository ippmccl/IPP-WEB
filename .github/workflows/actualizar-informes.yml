name: Actualizar informes.json

on:
  push:
    paths:
      - '20**/**'
      - 'scripts/generar-informes-json.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Actualizar informes.json
        run: node scripts/generar-informes-json.mjs

      - name: Commit si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet informes.json; then
            git add informes.json
            git commit -m "chore: actualizar informes.json [skip ci]"
            git push
          else
            echo "Sin cambios en informes.json"
          fi
